  <script>
    /*
    Get some key material to use as input to the deriveKey method.
    The key material is a password supplied by the user.
    */
    function getKeyMaterial(inputkey) {
      const password = inputkey;
      const enc = new TextEncoder();
      return window.crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveBits", "deriveKey"],
      );
    }

    function getKey(keyMaterial, salt) {
      return window.crypto.subtle.deriveKey(
        {
          "name": "PBKDF2",
          salt: salt,
          "iterations": 100000,
          "hash": "SHA-256"
        },
        keyMaterial,
        { "name": "AES-GCM", "length": 256 },
        true,
        ["encrypt", "decrypt"]
      );
    }

    async function encrypt(plaintext, privkey, salt, iv) {
      const keyMaterial = await getKeyMaterial(privkey);
      const key = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt,
          iterations: 100000,
          hash: "SHA-256",
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        true,
        ["encrypt", "decrypt"],
      );

      return window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext);
    }






    async function decrypt(ciphertext, privkey, salt, iv) {
      const keyMaterial = await getKeyMaterial(privkey)
      const finalkey = await getKey(keyMaterial, salt);
      //console.log(finalkey)
      //console.log(iv)
      //console.log(ciphertext)
      let decrypted = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: iv,
        },
        finalkey,
        ciphertext
      );
      //console.log(decrypted)
      let dec = new TextDecoder();
      //console.log(dec.decode(decrypted))
      return new TextDecoder().decode(decrypted)
    }


    async function hash(string) {
      const utf8 = new TextEncoder().encode(string);
      const hashBuffer = await window.crypto.subtle.digest('SHA-512', utf8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray
        .map((bytes) => bytes.toString(16).padStart(2, '0'))
        .join('');
      return hashHex;
    }

    function buf2hex(buffer) { // buffer is an ArrayBuffer
      return [...new Uint8Array(buffer)]
        .map(x => x.toString(16).padStart(2, '0'))
        .join('');
    }

    function hex2buf(myhex) {
      return new Uint8Array(myhex.match(/[\da-f]{2}/gi).map(function (h) {
        return parseInt(h, 16)
      })).buffer
    }
