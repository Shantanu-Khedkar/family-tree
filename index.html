    <script>
      

      //Handles Google Sheets GAPI stuff.


      const SPREADSHEET_ID = "1fRnnoFGOOy6bij00WrskrUEJQBXf7RU4EKk8_x7JHHg"
      const SPREADHSHEET_RANGE = "FamilyTree"
      const FUNCTION_NAME = populate; //Name of the function to be called after sucessfull authentication

      var accesstoken
      var sheet_data

      /*setup_auth() generates the JWT (JSON Web Token) used for initial authorization 
      via the jsrsasign library (need to move to libsodium at some point). The JWT is 
      generated based on the private key and email address of a service account, 
      eliminating the need of user authentication via Google.
      
      Note: Most of this function was copied and pasted from TerryR999's comment on
      Github at https://github.com/google/google-api-javascript-client/issues/428.
      Thank you!
      */

      function setup_auth(svcacct, privkey) {
        gapi.load('client', () => { })
        var header = { "alg": "RS256", "typ": "JWT" }
        var to_be_signed = {}
        to_be_signed.aud = "https://www.googleapis.com/oauth2/v3/token"
        to_be_signed.scope = "https://www.googleapis.com/auth/spreadsheets.readonly"
        to_be_signed.iss = svcacct
        to_be_signed.exp = KJUR.jws.IntDate.get("now + 1hour")
        to_be_signed.iat = KJUR.jws.IntDate.get("now")
        var stringified_data = JSON.stringify(to_be_signed)
        var JWT = KJUR.jws.JWS.sign(null, header, stringified_data, privkey)
        return JWT
      }


      /*
      authenticate() uses the JWT to authenticate with the Google API via
      an XMLHTTPRequest.  The XHR returns an access token to be used to 
      authenticate for accessing google sheets. This token is used by the 
      callback.
       */
      function authenticate(callback, JWT) {
        //Prepare XHR with JWT and other stuff.
        var XHR = new XMLHttpRequest()
        var urlEncodedData = ""
        var urlEncodedDataPairs = []
        urlEncodedDataPairs.push(encodeURIComponent("grant_type") + '=' + encodeURIComponent("urn:ietf:params:oauth:grant-type:jwt-bearer"))
        urlEncodedDataPairs.push(encodeURIComponent("assertion") + '=' + encodeURIComponent(JWT))
        urlEncodedData = urlEncodedDataPairs.join('&').replace(/%20/g, '+')

        //
        XHR.addEventListener('load', function (event) {
          token = JSON.parse(XHR.responseText)
          try {
            gapi.client.setToken(token)
            trioAuthDone = true
            trioTokenExpires = new Date()
            trioTokenExpires.setSeconds(trioTokenExpires.getSeconds() + token.expires_in - 300) //Now + token expiry minus 5 minutes
            console.log("Auth Done")
          } catch (error) {
            console.error("Error: " + error);
            console.log("Error has been resolved")
          }

          callback()
        })
        XHR.addEventListener('error', function (event) {
          console.log('Error in Auth: ' + event)
          console.log("Authorization failed")
        })
        XHR.open('POST', 'https://www.googleapis.com/oauth2/v3/token')
        XHR.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded')
        XHR.send(urlEncodedData)
      }

      /*
      get_sheet_data() uses the access token to get the spreadsheet data from a
      specific range. The gapi methods could be used, but they don't work on 
      file:// paths (which could possibly mean drv.tw) so the XMLHTTPRequest is 
      manually crafted.
       */
      function get_sheet_data(range, callback) {
        var XHR2 = new XMLHttpRequest()
        XHR2.open('GET', 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + range)
        XHR2.setRequestHeader("Authorization", "Bearer " + token["access_token"])
        XHR2.onreadystatechange = function () {
          if (XHR2.readyState == 4) {
            sheet_data = JSON.parse(XHR2.responseText)

            console.log("Success, authenticated to access GoogleSheet: " + SPREADSHEET_ID + ", " + range);
            callback();
          }
        }
        XHR2.addEventListener('error', function (event) {
          console.log('Error in Auth: ' + event)
          console.log("Authorization failed")
        })
        XHR2.send()

      }

      //Called on load of gapi, so you don't have to manually call it.
      function gapistuff(range, key, serviceAccount) {
        authenticate(() => { get_sheet_data(range, FUNCTION_NAME) }, setup_auth(serviceAccount, key))
      }
      function getData(range) {
        get_sheet_data(range, () => { return sheet_data.values });
      }
    </script>

    <script>

      


      function getKeyMaterial(inputkey) {
        const password = inputkey;
        const enc = new TextEncoder();
        return window.crypto.subtle.importKey(
          "raw",
          enc.encode(password),
          "PBKDF2",
          false,
          ["deriveBits", "deriveKey"],
        );
      }

      function getKey(keyMaterial, salt) {
        return window.crypto.subtle.deriveKey(
          {
            "name": "PBKDF2",
            salt: salt,
            "iterations": 100000,
            "hash": "SHA-256"
          },
          keyMaterial,
          { "name": "AES-GCM", "length": 256 },
          true,
          ["encrypt", "decrypt"]
        );
      }




      async function decrypt(ciphertext, privkey, salt, iv) {
        const keyMaterial = await getKeyMaterial(privkey)
        const finalkey = await getKey(keyMaterial, salt);
        let decrypted = await window.crypto.subtle.decrypt(
          {
            name: "AES-GCM",
            iv: iv,
          },
          finalkey,
          ciphertext
        );
        let dec = new TextDecoder();
      
        return new TextDecoder().decode(decrypted)
      }


      async function hash(string) {
        const utf8 = new TextEncoder().encode(string);
        const hashBuffer = await window.crypto.subtle.digest('SHA-512', utf8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray
          .map((bytes) => bytes.toString(16).padStart(2, '0'))
          .join('');
        return hashHex;
      }

      function buf2hex(buffer) {
        return [...new Uint8Array(buffer)]
          .map(x => x.toString(16).padStart(2, '0'))
          .join('');
      }

      function hex2buf(myhex) {
        return new Uint8Array(myhex.match(/[\da-f]{2}/gi).map(function (h) {
          return parseInt(h, 16)
        })).buffer
      }
